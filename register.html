<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Neox Scripts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#050505] text-white flex items-center justify-center min-h-screen font-sans">
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-[500px] bg-orange-600/10 blur-[120px] rounded-full -z-10"></div>
    
    <div class="bg-[#0f0f12]/80 backdrop-blur-xl p-10 rounded-[2.5rem] border border-white/5 w-full max-w-md shadow-2xl">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black italic tracking-tighter">NEOX<span class="text-orange-500">SCRIPTS</span></h1>
            <p class="text-gray-500 text-sm mt-2">Crea tu cuenta para acceder a tus compras</p>
        </div>

        <form id="register-form" class="space-y-6">
            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-gray-400 mb-2">Email</label>
                <input type="email" id="reg-email" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl focus:border-orange-500 outline-none transition" placeholder="tu@email.com" required>
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-gray-400 mb-2">Contraseña</label>
                <input type="password" id="reg-password" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl focus:border-orange-500 outline-none transition" placeholder="••••••••" required>
            </div>
            <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 py-4 rounded-2xl font-black transition-all shadow-lg shadow-orange-600/20">REGISTRARSE</button>
        </form>
        <p class="text-center mt-8 text-sm text-gray-500">¿Ya tienes cuenta? <a href="login.html" class="text-orange-500 font-bold">Entra aquí</a></p>
    </div>

    <script>
        const supabase = window.supabase.createClient('https://ahiywclqqdrobugkaval.supabase.co', 'TU_KEY_PUBLICA_ANON');

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            const { data, error } = await supabase.auth.signUp({ email, password });

            if (error) alert(error.message);
            else alert("¡Registro exitoso! Revisa tu email para confirmar.");
        });
    </script>
</body>
</html>
