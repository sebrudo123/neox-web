<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neox Admin | Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: white; }
        .glass { background: rgba(15, 15, 18, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .orange-border { border-left: 4px solid #f97316; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div>
                <h1 class="text-4xl font-black italic tracking-tighter">NEOX<span class="text-orange-500">ADMIN</span></h1>
                <p class="text-gray-500 text-xs font-bold uppercase tracking-[0.3em] mt-1">Dashboard de Control</p>
            </div>
            <div class="flex gap-4">
                <a href="index.html" class="glass px-6 py-3 rounded-2xl text-[10px] font-black hover:bg-white/5 transition uppercase tracking-widest">Ir a la Tienda</a>
                <button onclick="window.location.reload()" class="bg-orange-600 px-6 py-3 rounded-2xl text-[10px] font-black hover:bg-orange-500 transition uppercase tracking-widest">Actualizar Datos</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <div class="glass p-8 rounded-[2rem] orange-border">
                <p class="text-gray-500 text-[10px] font-black uppercase tracking-widest">Usuario Activo</p>
                <p id="admin-display-email" class="text-lg font-bold mt-2 truncate text-orange-500">Cargando...</p>
            </div>
            <div class="glass p-8 rounded-[2rem]">
                <p class="text-gray-500 text-[10px] font-black uppercase tracking-widest">Pedidos Realizados</p>
                <p id="stats-pedidos" class="text-4xl font-black mt-2 italic">0</p>
            </div>
            <div class="glass p-8 rounded-[2rem]">
                <p class="text-gray-500 text-[10px] font-black uppercase tracking-widest">Base de Datos</p>
                <p class="text-xl font-bold mt-2 text-green-500">ONLINE</p>
            </div>
        </div>

        <div class="glass rounded-[2.5rem] overflow-hidden">
            <div class="p-8 border-b border-white/5 bg-white/[0.02] flex justify-between items-center">
                <h2 class="text-xl font-black italic tracking-tighter uppercase">Gestión de <span class="text-orange-500">Pedidos</span></h2>
                <span class="text-[10px] bg-orange-600/20 text-orange-500 px-3 py-1 rounded-full font-bold uppercase tracking-widest">Tiempo Real</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-white/5 text-[10px] uppercase font-black tracking-[0.2em] text-gray-400">
                        <tr>
                            <th class="p-6">Fecha</th>
                            <th class="p-6">Cliente (Email)</th>
                            <th class="p-6">Script</th>
                            <th class="p-6">Precio</th>
                            <th class="p-6 text-right">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="pedidos-list" class="divide-y divide-white/5">
                        <tr>
                            <td colspan="5" class="p-10 text-center text-gray-500 italic">
                                Cargando base de datos de pedidos...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const _URL = "https://ahiywclqqdrobugkaval.supabase.co";
        const _KEY = "sb_publishable_4dJKjnB_2ZYXEt5nK2pUOQ_6PGquGmQ";
        const supabaseAdmin = supabase.createClient(_URL, _KEY);

        async function initAdmin() {
            // 1. Verificar Sesión
            const { data: { user } } = await supabaseAdmin.auth.getUser();

            if (!user) {
                alert("Acceso denegado. Por favor, inicia sesión.");
                window.location.href = "login.html";
                return;
            }

            document.getElementById('admin-display-email').innerText = user.email;

            // 2. Cargar Pedidos de la tabla 'pedidos'
            const { data: pedidos, error } = await supabaseAdmin
                .from('pedidos')
                .select('*')
                .order('created_at', { ascending: false });

            const listBody = document.getElementById('pedidos-list');
            
            if (error) {
                console.error(error);
                listBody.innerHTML = `<tr><td colspan="5" class="p-10 text-center text-red-500">Error: Crea la tabla 'pedidos' en Supabase.</td></tr>`;
                return;
            }

            if (pedidos.length === 0) {
                listBody.innerHTML = `<tr><td colspan="5" class="p-10 text-center text-gray-500 italic">No hay pedidos registrados todavía.</td></tr>`;
                return;
            }

            document.getElementById('stats-pedidos').innerText = pedidos.length;
            listBody.innerHTML = ''; // Limpiar mensaje de carga

            pedidos.forEach(p => {
                const fecha = new Date(p.created_at).toLocaleDateString('es-ES');
                listBody.innerHTML += `
                    <tr class="hover:bg-white/[0.02] transition group">
                        <td class="p-6 text-xs text-gray-500 font-mono">${fecha}</td>
                        <td class="p-6 font-bold text-sm text-white">${p.email}</td>
                        <td class="p-6">
                            <span class="bg-orange-600/10 text-orange-500 text-[10px] px-3 py-1 rounded-lg font-black uppercase tracking-widest">${p.script_name}</span>
                        </td>
                        <td class="p-6 font-black text-white italic">$${p.price}</td>
                        <td class="p-6 text-right">
                            <button onclick="deletePedido('${p.id}')" class="text-gray-600 hover:text-red-500 transition text-[10px] font-black uppercase">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function deletePedido(id) {
            if(confirm("¿Estás seguro de eliminar este pedido?")) {
                const { error } = await supabaseAdmin.from('pedidos').delete().eq('id', id);
                if (error) alert("Error al eliminar");
                else window.location.reload();
            }
        }

        initAdmin();
    </script>
</body>
</html>
