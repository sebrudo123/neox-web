<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Neox Scripts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#050505] text-white flex items-center justify-center min-h-screen font-sans">
    <div class="bg-[#0f0f12]/80 backdrop-blur-xl p-10 rounded-[2.5rem] border border-white/5 w-full max-w-md">
        <h1 class="text-3xl font-black italic text-center mb-10">LOGIN <span class="text-orange-500">NEOX</span></h1>
        
        <form id="login-form" class="space-y-6">
            <input type="email" id="log-email" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl focus:border-orange-500 outline-none" placeholder="Email" required>
            <input type="password" id="log-password" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl focus:border-orange-500 outline-none" placeholder="Contraseña" required>
            <button type="submit" class="w-full bg-orange-600 py-4 rounded-2xl font-black hover:bg-orange-500 transition shadow-lg shadow-orange-600/20">ENTRAR</button>
        </form>
    </div>

    <script>
        const supabase = window.supabase.createClient('https://ahiywclqqdrobugkaval.supabase.co', 'TU_KEY_PUBLICA_ANON');

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('log-email').value;
            const password = document.getElementById('log-password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) alert(error.message);
            else window.location.href = 'index.html'; // Redirige a la tienda al entrar
        });
    </script>
</body>
</html>
